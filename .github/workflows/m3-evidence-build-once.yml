# Temporary branch-scoped build; remove after the official deck is generated.
name: Temporary M3 evidence graphic verification
on:
  push:
    branches:
      - subin/ppt-m3-evidence-visual-20261013
    paths:
      - .github/workflows/m3-evidence-build-once.yml
      - ppt/build_deck.js

permissions:
  contents: write

jobs:
  build-ppt:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out review branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Node 22 with lockfile
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ppt/package-lock.json
      - name: Generate PPTX from official JS source
        working-directory: ppt
        run: |
          npm ci --no-audit --no-fund
          git show 9cebdb76b12492dd38636900da9d1672e7680f9f:ppt/build_deck.js > build_deck.original_qa.js
          node build_deck.original_qa.js /tmp/m3_before.pptx
          rm build_deck.original_qa.js
          node build_deck.js DCC2026_예선_결과정리.pptx
      - name: Verify exactly slide 31 changes, and audit graph evidence
        run: |
          test -s /tmp/m3_before.pptx
          python - <<'PY'
          import re,zipfile,xml.etree.ElementTree as ET
          from pathlib import Path
          ns='{http://schemas.openxmlformats.org/drawingml/2006/main}t'
          def stxt(file):
            with zipfile.ZipFile(file) as z:
              assert z.testzip() is None
              paths=sorted([n for n in z.namelist() if re.fullmatch(r'ppt/slides/slide\d+\.xml',n)],key=lambda p:int(re.search(r'slide(\d+)',p).group(1)))
              return [''.join(t.text or '' for t in ET.fromstring(z.read(p)).iter(ns)) for p in paths]
          before=stxt('/tmp/m3_before.pptx')
          after=stxt('ppt/DCC2026_예선_결과정리.pptx')
          assert len(before)==len(after)==37,(len(before),len(after))
          for slide in range(1,38):
            if slide!=31:assert after[slide-1]==before[slide-1],f'unexpected text change on slide {slide}'
          changed=after[30]
          for term in ['88.6%','75.7%','63.7%','전신쇠약','오심','두통','어지러워서 정신을 못 차리겠다','최종 RoBERTa 예측 사례 아님','REJECT','ADOPT','92%','약 90%','약 52%']:
            assert term in changed, f'missing M3 content: {term}'
          assert 'TF-IDF + LR (기준선)' not in changed, 'old duplicate score bars remain'
          assert after[29]==before[29], 'final RoBERTa scores on slide 30 must not change'
          src=Path('ppt/build_deck.js').read_text()
          assert '["오심", 88.6, C.red]' in src
          assert '["전신쇠약", 75.7, "E78A47"]' in src
          assert '["두통", 63.7, C.sky]' in src
          print('PASS: 37 slides, only M3 slide31 text changed, evidence and metric labels verified')
          PY
      - name: Upload source-generated PPTX for visual review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3-evidence-visual-37slide
          path: ppt/DCC2026_예선_결과정리.pptx
          if-no-files-found: error
          retention-days: 2
      - name: Summarize artifact-only build policy
        run: |
          echo 'PASS: Generated PPTX supplied as Actions artifact only; latest main intentionally omits oversized .pptx' >> "$GITHUB_STEP_SUMMARY"
