# Temporary branch-only verification workflow; remove after final PPTX is built.
name: Temporary M3 relocated imagery and percent notation QA
on:
  push:
    branches:
      - subin/ppt-m3-summary-percent-icons-20261013
    paths:
      - .github/workflows/m3-quote-and-percent-once.yml
      - ppt/build_deck.js

permissions:
  contents: read

jobs:
  validate-deck:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout modified source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ppt/package-lock.json
      - name: Generate main baseline and amended decks
        working-directory: ppt
        run: |
          npm ci --no-audit --no-fund
          git show 7f1304ad90f1c6c0be02a265e558789ed2896d72:ppt/build_deck.js > build_deck.original_qa.js
          node build_deck.original_qa.js /tmp/m3_original.pptx
          rm build_deck.original_qa.js
          node build_deck.js DCC2026_예선_결과정리.pptx
      - name: Verify changes are restricted and percentages correct
        run: |
          python - <<'PY'
          import re,zipfile,xml.etree.ElementTree as ET
          from pathlib import Path
          ns='{http://schemas.openxmlformats.org/drawingml/2006/main}t'
          def read(p):
            with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              files=sorted((n for n in z.namelist() if re.fullmatch(r'ppt/slides/slide\d+\.xml',n)),key=lambda s:int(re.search(r'slide(\d+)',s).group(1)))
              texts=[''.join(e.text or '' for e in ET.fromstring(z.read(x)).iter(ns)) for x in files]
              return texts,z.namelist()
          before,_=read('/tmp/m3_original.pptx')
          after,allfiles=read('ppt/DCC2026_예선_결과정리.pptx')
          assert len(before)==len(after)==37
          changed=[i for i in range(1,38) if before[i-1]!=after[i-1]]
          assert changed==[30,31,32,35,36],f'Unexpected text modifications: {changed}'
          m30,m31,m32,m35,m36=(after[i-1] for i in changed)
          for t in ['65.34%','66.90%','56.89%','62.46%','64.33%','40.00%','53.15%','59.39%']:
            assert t in m30,t
          for t in ['어지러워서 정신을 못 차리겠다','최종 RoBERTa 예측 사례 아님','REJECT','ADOPT','약 52%','92%','약 90%','+0.28%p','+1.00%p']:
            assert t in m31,t
          for t in ['65.34%','+8.45%p','M3 56.89%','M2 신고자/대원']:
            assert t in m32,t
          for t in ['64.39%','65.04%','65.15%','+0.74%p','+1.00%p']:
            assert t in m35,t
          for t in ['59.39%','53.15%','40.00%','19.5%']:
            assert t in m36,t
          with zipfile.ZipFile('ppt/DCC2026_예선_결과정리.pptx') as z:
            a31=z.read('ppt/slides/slide31.xml').decode()
            b31=zipfile.ZipFile('/tmp/m3_original.pptx').read('ppt/slides/slide31.xml').decode()
            a32=z.read('ppt/slides/slide32.xml').decode()
            b32=zipfile.ZipFile('/tmp/m3_original.pptx').read('ppt/slides/slide32.xml').decode()
            assert a31.count('<p:pic>')>=b31.count('<p:pic>')+2, 'Phone and speech-bubble icons missing from M3 quotation card'
            assert a32.count('<p:pic>')==b32.count('<p:pic>'),'Incorrectly placed icons persist on summary slide'
            charts=[z.read(n).decode() for n in allfiles if re.fullmatch(r'ppt/charts/chart\d+\.xml',n)]
            assert any('0.0%' in t for t in charts), 'Percent-formatted chart labels missing'
          print('PASS: exactly slides 30/31/32/35/36 updated; M3 score %; icons only on quote card')
          PY
      - name: Upload source-generated deck for visual inspection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3-quote-image-corrected-37slide
          path: ppt/DCC2026_예선_결과정리.pptx
          retention-days: 2
          if-no-files-found: error
