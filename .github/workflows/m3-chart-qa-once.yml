# Temporary branch-only regeneration. Remove after generated deck is verified and committed.
name: Temporary Mission 3 chart QA
on:
  push:
    branches:
      - subin/ppt-m3-chart-integrity-20261013
    paths:
      - .github/workflows/m3-chart-qa-once.yml
      - ppt/build_deck.js

permissions:
  contents: write

jobs:
  build-ppt:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out working branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ppt/package-lock.json
      - name: Rebuild official presentation from source only
        working-directory: ppt
        run: |
          npm ci --no-audit --no-fund
          node build_deck.js DCC2026_예선_결과정리.pptx
      - name: Verify main slides unchanged and edited Mission 3 texts
        run: |
          git show origin/main:ppt/DCC2026_예선_결과정리.pptx > /tmp/before.pptx
          python - <<'PY'
          import re, zipfile, xml.etree.ElementTree as ET
          from pathlib import Path
          p=Path("ppt/DCC2026_예선_결과정리.pptx")
          ns="{http://schemas.openxmlformats.org/drawingml/2006/main}t"
          def texts(src):
              with zipfile.ZipFile(src) as z:
                  fn=sorted([n for n in z.namelist() if re.fullmatch(r'ppt/slides/slide\d+\.xml',n)],key=lambda n:int(re.search(r'slide(\d+)',n).group(1)))
                  return ["".join(e.text or "" for e in ET.fromstring(z.read(f)).iter(ns)) for f in fn]
          aft, bef=texts(p),texts("/tmp/before.pptx")
          assert len(aft)==len(bef)==20, (len(aft),len(bef))
          for i in list(range(1,17))+[18,19,20]:
              assert aft[i-1]==bef[i-1], f"Slide {i} changed unexpectedly"
          assert "TF-IDF·KcBERT" in aft[16], "M3 model clarification missing"
          assert "92%" in aft[16] and "52%" in aft[16], "Error analysis lost"
          assert "REJECT" in aft[16] and "ADOPT" in aft[16], "Decision sequence lost"
          assert "0.6534" in aft[15], "M3 result changed on slide 16"
          assert "→ 두 모델의 오류가 달라" not in aft[16]
          src=Path("ppt/build_deck.js").read_text()
          assert "valAxisMinVal: 0, valAxisMaxVal: 1" in src
          print("PASS: 20 slides; only M3 slide17 changed; decision/case metrics/axis preserved")
          PY
      - name: Export generated PPTX for visual review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3-axis-review
          path: ppt/DCC2026_예선_결과정리.pptx
          if-no-files-found: error
          retention-days: 2
      - name: Commit exact generated PPTX
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- ppt/DCC2026_예선_결과정리.pptx
          if git diff --cached --quiet; then
            echo 'No generated PPTX diff'
          else
            git commit -m 'build(ppt): regenerate Mission 3 evidence chart'
            git push origin HEAD:subin/ppt-m3-chart-integrity-20261013
          fi
