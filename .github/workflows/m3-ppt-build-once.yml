# Temporary, branch-scoped PPT build. Remove after generated PPTX is committed.
name: Temporary M3 PPT build (branch only)
on:
  push:
    branches:
      - subin/ppt-m3-storytelling-20261013
    paths:
      - ".github/workflows/m3-ppt-build-once.yml"
      - "ppt/build_deck.js"

permissions:
  contents: write

jobs:
  build-ppt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out this branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ppt/package-lock.json
      - name: Rebuild PPTX ONLY from committed build_deck.js
        working-directory: ppt
        run: |
          npm ci --no-audit --no-fund
          node build_deck.js DCC2026_예선_결과정리.pptx
      - name: Verify PPTX structure and unchanged non-M3 text
        run: |
          git show origin/main:ppt/DCC2026_예선_결과정리.pptx > /tmp/m3-main-before.pptx
          python - <<'PY'
          import re, zipfile, xml.etree.ElementTree as ET
          from pathlib import Path
          current=Path("ppt/DCC2026_예선_결과정리.pptx")
          before=Path("/tmp/m3-main-before.pptx")
          ns="{http://schemas.openxmlformats.org/drawingml/2006/main}t"
          def slide_texts(path):
              with zipfile.ZipFile(path) as z:
                  slides=sorted([n for n in z.namelist() if re.fullmatch(r'ppt/slides/slide\d+\.xml',n)], key=lambda x:int(re.search(r'slide(\d+)',x).group(1)))
                  texts=[]
                  for sl in slides:
                      root=ET.fromstring(z.read(sl))
                      texts.append("".join(e.text or "" for e in root.iter(ns)))
                  return texts
          aft, orig=slide_texts(current),slide_texts(before)
          assert len(aft)==20, f"expected 20 slides, got {len(aft)}"
          assert len(orig)==20, f"main deck changed slide count: {len(orig)}"
          for i in list(range(1,17))+[18,19,20]:
              assert aft[i-1]==orig[i-1], f"non-M3 slide {i} text changed"
          assert '0.6534' in aft[15], "Missing M3 final score on slide 16"
          assert '0.6690' in aft[15], "Missing M3 Micro F1 on slide 16"
          assert 'REJECT' in aft[16] and 'ADOPT' in aft[16], "Missing M3 decision logic on slide 17"
          assert '0.0028' in aft[16] and '0.01' in aft[16], "Missing M3 reject threshold evidence"
          assert '0.6510' not in aft[16], "Obsolete mixed-score bar remains on slide 17"
          assert '52%' in aft[16] and '92%' in aft[16], "Existing error-analysis visualization missing"
          print('PASS: 20 slides, all non-17 pages unchanged, Mission 3 decisions & metrics verified')
          PY
      - name: Upload canonical PPTX for visual check
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr200-rebased-deck
          path: ppt/DCC2026_예선_결과정리.pptx
          if-no-files-found: error
          retention-days: 1
      - name: Commit generated PPTX into this branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- ppt/DCC2026_예선_결과정리.pptx
          if git diff --cached --quiet; then
            echo 'Generated PPTX unchanged.'
          else
            git commit -m 'build(ppt): regenerate PPTX from Mission 3 source'
            git push origin HEAD:subin/ppt-m3-storytelling-20261013
          fi
