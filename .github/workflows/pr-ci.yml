name: PR CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  policy:
    name: PR CI / policy
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout tested merge commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout trusted policy from main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Evaluate repository policy
        working-directory: candidate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python ../trusted/scripts/pr_policy.py
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --config ../trusted/.github/merge-gate.json
          --json-output ../merge-gate-policy.json

  tests:
    name: PR CI / tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout tested merge commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout trusted tests and policy from main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Determine whether tests are required
        id: scope
        working-directory: candidate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python ../trusted/scripts/pr_policy.py
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --config ../trusted/.github/merge-gate.json
          --scope-only
          --github-output "$GITHUB_OUTPUT"

      - name: Set up Python 3.11
        if: steps.scope.outputs.tests_required == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: candidate/requirements.txt

      - name: Install dependencies
        if: steps.scope.outputs.tests_required == 'true'
        working-directory: candidate
        # CPU 전용 torch를 먼저 설치한다. 그냥 설치하면 CUDA 패키지(수 GB)까지 받아 러너 디스크가 부족해진다.
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchaudio
          python -m pip install --requirement requirements.txt

      - name: Run candidate test suite
        if: steps.scope.outputs.tests_required == 'true'
        working-directory: candidate
        run: python -m pytest -q --disable-warnings

      - name: Run trusted main tests against candidate code
        if: steps.scope.outputs.tests_changed == 'true'
        working-directory: candidate
        run: |
          cp -R ../trusted/tests .merge-gate-baseline-tests
          # Exemptions come from the trusted main config, so a PR cannot exempt its own tests.
          if [ -f ../trusted/scripts/merge_gate_baseline.py ]; then
            python ../trusted/scripts/merge_gate_baseline.py \
              --config ../trusted/.github/merge-gate.json \
              --tests-dir .merge-gate-baseline-tests
          else
            python -m pytest .merge-gate-baseline-tests -q --disable-warnings
          fi

      - name: Report documentation-only change
        if: steps.scope.outputs.tests_required != 'true'
        run: echo "Python 테스트 대상 변경이 없어 테스트를 생략합니다."
