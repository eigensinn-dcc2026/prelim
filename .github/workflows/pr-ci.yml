name: PR CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  policy:
    name: PR CI / policy
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout tested merge commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Evaluate repository policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python scripts/pr_policy.py
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --config .github/merge-gate.json
          --json-output merge-gate-policy.json

  tests:
    name: PR CI / tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout tested merge commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine whether tests are required
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python scripts/pr_policy.py
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --config .github/merge-gate.json
          --scope-only
          --github-output "$GITHUB_OUTPUT"

      - name: Set up Python 3.11
        if: steps.scope.outputs.tests_required == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        if: steps.scope.outputs.tests_required == 'true'
        run: python -m pip install --requirement requirements.txt

      - name: Run test suite
        if: steps.scope.outputs.tests_required == 'true'
        run: python -m pytest -q --disable-warnings

      - name: Report documentation-only change
        if: steps.scope.outputs.tests_required != 'true'
        run: echo "Python 테스트 대상 변경이 없어 테스트를 생략합니다."
