name: PR Verdict

on:
  workflow_run:
    workflows:
      - PR CI
    types:
      - completed
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      pr_number:
        description: Optional PR number; leave blank to refresh every open PR
        required: false
        type: string

permissions:
  actions: read
  checks: read
  contents: read
  issues: write
  pull-requests: write
  statuses: write

concurrency:
  group: pr-verdict-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  verdict:
    name: Merge Gate / verdict
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Evaluate and publish PR verdict
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/pr_verdict.py
          --event-path "$GITHUB_EVENT_PATH"
          --repository "$GITHUB_REPOSITORY"
          --config .github/merge-gate.json
